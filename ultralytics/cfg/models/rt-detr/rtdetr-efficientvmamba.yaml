# Ultralytics RT-DETR with EfficientVMamba Backbone
# EfficientVMamba: arXiv 2403.09977
# https://github.com/TerryPei/EfficientVMamba

# This configuration replaces the HGNetv2 backbone with EfficientVMamba-S
# for improved global context modeling using State Space Models (SSM)

# Parameters
nc: 80  # number of classes
scales:
  # [depth, width, max_channels]
  s: [1.00, 1.00, 1024]  # EfficientVMamba-S (Small)

# EfficientVMamba-S configuration:
# Stage 0: dims=96, depth=2 (stride 4)
# Stage 1: dims=192, depth=2 (stride 8) -> P3
# Stage 2: dims=384, depth=9 (stride 16) -> P4
# Stage 3: dims=768, depth=2 (stride 32) -> P5

backbone:
  # [from, repeats, module, args]
  # Stem: 3 -> 96 channels, stride 4
  - [-1, 1, EfficientVMambaStem, [96]]  # 0-P2/4

  # Stage 0: 96 channels (stride 4)
  - [-1, 1, EfficientVMambaBlock, [96, 2]]  # 1

  # Stage 1: 96 -> 192 channels (stride 8) - P3
  - [-1, 1, EfficientVMambaStage, [192, 2, True]]  # 2-P3/8

  # Stage 2: 192 -> 384 channels (stride 16) - P4
  - [-1, 1, EfficientVMambaStage, [384, 9, True]]  # 3-P4/16

  # Stage 3: 384 -> 768 channels (stride 32) - P5
  - [-1, 1, EfficientVMambaStage, [768, 2, True]]  # 4-P5/32

head:
  # RT-DETR head with AIFI and multi-scale fusion
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 5 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]  # 6
  - [-1, 1, Conv, [256, 1, 1]]  # 7, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 8
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.1
  - [[-2, -1], 1, Concat, [1]]  # 10
  - [-1, 3, RepC3, [256]]  # 11, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]  # 12, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 14 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 15
  - [-1, 3, RepC3, [256]]  # 16 X3, fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]  # 17, downsample_convs.0
  - [[-1, 12], 1, Concat, [1]]  # 18 cat Y4
  - [-1, 3, RepC3, [256]]  # 19 F4, pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]  # 20, downsample_convs.1
  - [[-1, 7], 1, Concat, [1]]  # 21 cat Y5
  - [-1, 3, RepC3, [256]]  # 22 F5, pan_blocks.1

  - [[16, 19, 22], 1, RTDETRDecoder, [nc]]  # 23 Detect(P3, P4, P5)
